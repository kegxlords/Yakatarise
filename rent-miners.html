    .miner-price { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 20px; }
    .spec-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 15px; }

  <div id="app-footer"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabase.auth.getSession();
      if(!session) return;

      // 1. Fetch Available Miners
      const { data: miners, error } = await window.supabase.from('miners').select('*').eq('is_active', true).order('price', { ascending: true });
      const container = document.getElementById('minersContainer');

      if (error || !miners || miners.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; grid-column: 1/-1;">No miners available.</div>';
        return;
      }

      // 2. Fetch User's Current Miners to check limits
      const { data: myMiners } = await window.supabase
        .from('user_miners')
        .select('miner_id')
        .eq('user_id', session.user.id)
        .eq('status', 'active');

      // Count how many of each miner the user owns
      const myMinerCounts = {};
      if (myMiners) {
        myMiners.forEach(m => {
          myMinerCounts[m.miner_id] = (myMinerCounts[m.miner_id] || 0) + 1;
        });
      }

      // 3. Render Miners with Limit Checks
      container.innerHTML = miners.map(m => {
        const totalReturn = Number(m.daily_revenue) * Number(m.duration_days);
        const currentCount = myMinerCounts[m.id] || 0;
        const limit = m.purchase_limit || 1;
        const isMaxedOut = currentCount >= limit;

        // Button Logic
        let btnHtml = '';
        if (isMaxedOut) {
          btnHtml = `<button class="btn btn-block" style="background: #E2E8F0; color: #94A3B8; cursor: not-allowed;" disabled>Limit Reached (${currentCount}/${limit})</button>`;
        } else {
          btnHtml = `<button class="btn btn-primary btn-block" onclick="rentMiner('${m.id}', this)">Rent Miner (${currentCount}/${limit})</button>`;
        }

        return `
          <div class="miner-card-split">
            <div class="miner-card-left">
              <img src="https://cdn-icons-png.flaticon.com/512/2721/2721698.png" alt="Miner">
              <div class="miner-rate">${((m.daily_revenue / m.price) * 100).toFixed(2)}%</div>
              <div class="miner-rate-label">Daily Rate</div>
            </div>
            <div class="miner-card-right">
              <div>
                <div class="miner-header-row">
                  <h3 class="miner-title">${m.name}</h3>
                  <span class="miner-badge">OPEN</span>
                </div>
                <span class="miner-term-badge">${m.duration_days} DAYS</span>
                <div class="miner-stats-grid">
                  <div class="miner-stat-item"><span class="miner-stat-label">Price</span><span class="miner-stat-val">₦${Number(m.price).toLocaleString()}</span></div>
                  <div class="miner-stat-item"><span class="miner-stat-label">Daily Return</span><span class="miner-stat-val">₦${Number(m.daily_revenue).toLocaleString()}</span></div>
                </div>
              </div>
              ${btnHtml}
            </div>
          </div>
        `;
      }).join('');
    });

    // Rent Function
    window.rentMiner = async function(minerId, btn) {
      if(!confirm("Are you sure? The cost will be deducted from your wallet.")) return;

      const originalText = btn.innerText;
      btn.innerText = "Processing...";
      btn.disabled = true;

      const result = await callApi('/api/rent-miner', { miner_id: minerId });

      if (result.success) {
        alert('✅ Success! Miner rented.');
        window.location.reload(); // Reload to update counts
      } else {
        alert('❌ Error: ' + (result.error || 'Transaction failed.'));
        btn.innerText = originalText;
        btn.disabled = false;
      }
    };
  </script>
