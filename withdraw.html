<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw Funds - JaKaTaRise Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .page-header-simple { padding: 20px; display: flex; align-items: center; gap: 15px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .back-btn { width: 36px; height: 36px; background: #F8FAFC; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text-main); font-weight: bold; }
    
    .balance-display { background: #fff; margin: 20px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
    .balance-display .lbl { font-size: 12px; color: #64748B; }
    .balance-display .val { font-size: 24px; font-weight: 800; color: var(--primary); }

    .time-warning { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; padding: 12px 20px; margin: 0 20px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    
    .form-container { padding: 0 20px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: #64748B; margin-bottom: 8px; font-weight: 600; }
    .input-group input { width: 100%; padding: 15px; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 15px; outline: none; background: #fff; }
    
    .fee-breakdown { background: #F8FAFC; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .fee-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #64748B; }
    .fee-row.total { border-top: 1px solid #E2E8F0; padding-top: 8px; margin-top: 8px; font-weight: 800; color: var(--text-main); font-size: 16px; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="page-header-simple">
    <a href="wallet.html" class="back-btn">‹</a>
    <h2 style="margin: 0; font-size: 18px;">Withdraw Funds</h2>
  </div>

  <div class="balance-display">
    <div class="lbl">Available Balance</div>
    <div class="val">₦0.00</div>
  </div>

  <div class="time-warning">
     Withdrawals are only open Mon-Sat, 9AM - 5PM.
  </div>

  <div class="form-container">
    <div class="input-group">
      <label>Amount to Withdraw (₦)</label>
      <input type="number" id="withdrawAmount" placeholder="Min. ₦1,000" oninput="calcFee()" />
    </div>

    <div class="fee-breakdown">
      <div class="fee-row"><span>Withdrawal Charge (8%)</span><span id="feeDisplay">₦0.00</span></div>
      <div class="fee-row total"><span>You Will Receive</span><span id="netDisplay">₦0.00</span></div>
    </div>

    <div class="input-group">
      <label>Bank Name</label>
      <input type="text" placeholder="e.g. GTBank" />
    </div>
    <div class="input-group">
      <label>Account Number</label>
      <input type="tel" placeholder="10 digits" />
    </div>
    <div class="input-group">
      <label>Account Name</label>
      <input type="text" placeholder="Name on account" />
    </div>

    <button class="btn btn-primary btn-block" style="border-radius: 12px; padding: 15px;">Submit Withdrawal Request</button>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/wallet.js"></script> <!-- Keep your existing wallet.js for time/fee logic -->
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabase.auth.getSession();
      if(!session) return;

      // 1. Fetch Balance
      const { data: wallet } = await window.supabase.from('wallets').select('balance').eq('user_id', session.user.id).single();
      if(wallet) document.querySelector('.balance-display .val').innerText = '₦' + Number(wallet.balance).toLocaleString();

      // 2.  Check Active Miner Requirement
      const { count } = await window.supabase
        .from('user_miners')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', session.user.id)
        .eq('status', 'active');

      const formContainer = document.querySelector('.form-container');
      const timeWarning = document.querySelector('.time-warning');

      if (!count || count === 0) {
        // Hide form and show restriction banner
        formContainer.innerHTML = `
          <div style="background: #FEF2F2; border: 1px solid #FECACA; border-radius: 16px; padding: 30px; text-align: center; margin-top: 20px;">
            <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
            <h3 style="color: var(--danger); margin: 0 0 10px 0;">Withdrawal Locked</h3>
            <p style="color: #991B1B; margin-bottom: 20px;">You must rent an active miner before you can withdraw your funds.</p>
            <a href="rent-miners.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 12px 24px; border-radius: 12px;">Rent a Miner Now</a>
          </div>
        `;
        if(timeWarning) timeWarning.style.display = 'none';
      } else {
        // User has a miner, attach form submit handler
        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button');
          const amount = document.getElementById('withdrawAmount').value;
          const bankName = e.target.querySelector('input[placeholder="e.g. GTBank"]').value;
          const acctNum = e.target.querySelector('input[placeholder="10 digits"]').value;
          const acctName = e.target.querySelector('input[placeholder="Name on account"]').value;

          btn.disabled = true;
          btn.innerText = 'Processing...';

          const result = await callApi('/api/request-withdrawal', {
            amount: parseFloat(amount),
            bank_name: bankName,
            account_number: acctNum,
            account_name: acctName
          });

          if (result.success) {
            alert('✅ Withdrawal request submitted! Admin will process it shortly.');
            window.location.href = 'transactions.html';
          } else {
            alert('❌ ' + (result.error || 'Failed to submit withdrawal.'));
            btn.disabled = false;
            btn.innerText = 'Submit Withdrawal Request';
          }
        });
      }
    });
  </script>
</body>
</html>
