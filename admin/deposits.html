<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposits - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html">👥 Users</a>
      <a href="deposits.html" class="active">💰 Deposits</a>
      <a href="withdrawals.html">💸 Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html">⚙️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Deposit Requests</h2>
      <select id="statusFilter" class="form-input" style="width: 200px;" onchange="loadDeposits()">
        <option value="pending">Pending Only</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="all">All Transactions</option>
      </select>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Amount</th>
            <th>Reference</th>
            <th>Date</th>
            <th>Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="depositBody">
          <tr><td colspan="6" style="text-align:center; padding: 40px;">Loading deposits...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    async function loadDeposits() {
      const filter = document.getElementById('statusFilter').value;
      const tbody = document.getElementById('depositBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">Loading...</td></tr>';

      let query = window.supabase.from('transactions').select('*, profiles(email)').eq('type', 'deposit').order('created_at', { ascending: false });
      if (filter !== 'all') query = query.eq('status', filter);

      const { data: txs } = await query;
      if (!txs || txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--admin-text-muted);">No deposits found.</td></tr>';
        return;
      }

      tbody.innerHTML = txs.map(tx => {
        let badgeClass = 'badge-warning';
        if(tx.status === 'approved') badgeClass = 'badge-success';
        if(tx.status === 'rejected') badgeClass = 'badge-danger';

        let actions = tx.status === 'pending' ? `
          <button class="btn btn-sm btn-approve" onclick="approveDeposit('${tx.id}', '${tx.user_id}', ${tx.amount})">Approve</button>
          <button class="btn btn-sm btn-reject" onclick="rejectDeposit('${tx.id}')">Reject</button>
        ` : '<span style="color: var(--admin-text-muted); font-size: 12px;">Processed</span>';

        return `
          <tr>
            <td><div style="font-weight:500;">${tx.profiles?.email || 'Unknown'}</div></td>
            <td style="font-weight:700; color: var(--brand-primary);">${Number(tx.amount).toLocaleString()}</td>
            <td><code style="background:#F1F5F9; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${tx.description || 'N/A'}</code></td>
            <td style="color: var(--admin-text-muted);">${new Date(tx.created_at).toLocaleDateString()}</td>
            <td><span class="badge ${badgeClass}">${tx.status}</span></td>
            <td style="text-align: right;">${actions}</td>
          </tr>
        `;
      }).join('');
    }

    window.approveDeposit = async function(id, userId, amount) {
      if(!confirm(`Approve ₦${amount.toLocaleString()} deposit?`)) return;
      const result = await callApi('/api/approve-deposit', { transaction_id: id, user_id: userId, amount });
      if(result.success) { alert('✅ Approved!'); loadDeposits(); } else alert(' ' + result.error);
    };

    window.rejectDeposit = async function(id) {
      if(!confirm('Reject this deposit?')) return;
      // You would create a /api/reject-deposit.js endpoint
      alert('Please create /api/reject-deposit.js to handle this.');
    };

    document.addEventListener('DOMContentLoaded', loadDeposits);
  </script>
</body>
</html>
