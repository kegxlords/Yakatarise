  <main class="admin-main">

    </div>

    <!-- Create Code Form -->
    <div class="form-card">
      <h3> Generate New Gift Code</h3>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Code (Leave blank to auto-generate)</label>
          <input type="text" id="newCode" class="form-input" placeholder="e.g. WELCOME2024" style="text-transform: uppercase;" />
        </div>
        <div class="form-group"><label class="form-label">Amount (₦)</label><input type="number" id="newAmount" class="form-input" placeholder="1000" /></div>
        <div class="form-group"><label class="form-label">Max Uses</label><input type="number" id="newMaxUses" class="form-input" value="1" /></div>
        <div class="form-group"><label class="form-label">Expires (Optional)</label><input type="date" id="newExpiry" class="form-input" /></div>
      </div>
      <button class="btn btn-primary" style="margin-top: 20px;" onclick="createGiftCode()">Generate Code</button>
    </div>

    <!-- Codes List -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Amount</th>
            <th>Usage</th>
            <th>Expires</th>
            <th>Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="codesTableBody">
          <tr><td colspan="6" style="text-align:center; padding: 40px;">Loading codes...</td></tr>
        </tbody>
      </table>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    async function loadCodes() {
      const { data: codes } = await window.supabase.from('gift_codes').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('codesTableBody');
      if (!codes) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">Error loading.</td></tr>'; return; }

      tbody.innerHTML = codes.map(c => {
        const isExpired = c.expires_at && new Date(c.expires_at) < new Date();
        const isFull = c.used_count >= c.max_uses;
        const status = !c.is_active ? 'Inactive' : isExpired ? 'Expired' : isFull ? 'Fully Used' : 'Active';
        const badgeClass = status === 'Active' ? 'badge-success' : 'badge-danger';

        return `
          <tr>
            <td style="font-weight:700; font-family: monospace; letter-spacing: 1px;">${c.code}</td>
            <td>₦${Number(c.amount).toLocaleString()}</td>
            <td>${c.used_count} / ${c.max_uses}</td>
            <td style="color: var(--admin-text-muted);">${c.expires_at ? new Date(c.expires_at).toLocaleDateString() : 'Never'}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
            <td style="text-align: right;">
              <button class="btn btn-sm ${c.is_active ? 'btn-reject' : 'btn-approve'}" onclick="toggleCode('${c.id}', ${c.is_active})">${c.is_active ? 'Deactivate' : 'Activate'}</button>
              <button class="btn btn-sm btn-outline" style="color: var(--danger);" onclick="deleteCode('${c.id}')">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.createGiftCode = async function() {
      let code = document.getElementById('newCode').value.trim().toUpperCase();
      const amount = document.getElementById('newAmount').value;
      const maxUses = document.getElementById('newMaxUses').value;
      const expiry = document.getElementById('newExpiry').value;

      if (!code) {
        // Auto-generate random code
        code = 'JTR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      }
      if (!amount) return alert('Please enter an amount');

      const { error } = await window.supabase.from('gift_codes').insert({
        code, amount, max_uses: maxUses || 1, 
        expires_at: expiry ? new Date(expiry).toISOString() : null,
        is_active: true
      });

      if (error) alert('Error: ' + error.message);
      else { alert('✅ Code generated!'); loadCodes(); }
    };

    window.toggleCode = async function(id, status) {
      await window.supabase.from('gift_codes').update({ is_active: !status }).eq('id', id);
      loadCodes();
    };

    window.deleteCode = async function(id) {
      if (!confirm('Delete this code permanently?')) return;
      await window.supabase.from('gift_codes').delete().eq('id', id);
      loadCodes();
    };

    document.addEventListener('DOMContentLoaded', loadCodes);
  </script>
</body>
</html>
