<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mining Plans - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html">👥 Users</a>
      <a href="deposits.html">💰 Deposits</a>
      <a href="withdrawals.html">💸 Withdrawals</a>
      <a href="miners.html" class="active">⛏️ Mining Plans</a>
      <a href="settings.html">⚙️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Mining Plans</h2>
    </div>

    <div class="form-card">
      <h3>➕ Add New Mining Plan</h3>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Plan Name</label><input type="text" id="newMinerName" class="form-input" placeholder="e.g. Pro Miner" /></div>
        <div class="form-group"><label class="form-label">Price (₦)</label><input type="number" id="newMinerPrice" class="form-input" placeholder="6200" /></div>
        <div class="form-group"><label class="form-label">Daily Revenue (₦)</label><input type="number" id="newMinerDaily" class="form-input" placeholder="310" /></div>
        <div class="form-group"><label class="form-label">Duration (Days)</label><input type="number" id="newMinerDuration" class="form-input" placeholder="180" /></div>
        <div class="form-group"><label class="form-label">Purchase Limit</label><input type="number" id="newMinerLimit" class="form-input" value="1" /></div>
      </div>
      <button class="btn btn-primary" style="margin-top: 20px;" onclick="addMiner()">Save New Plan</button>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Plan Name</th>
            <th>Price</th>
            <th>Daily Revenue</th>
            <th>Duration</th>
            <th>Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="minersTableBody">
          <tr><td colspan="6" style="text-align:center; padding: 40px;">Loading miners...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    async function loadMiners() {
      const { data: miners } = await window.supabase.from('miners').select('*').order('price', { ascending: true });
      const tbody = document.getElementById('minersTableBody');
      if (!miners) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">Error loading.</td></tr>'; return; }

      tbody.innerHTML = miners.map(m => `
        <tr>
          <td style="font-weight:600;">${m.name}</td>
          <td>₦${Number(m.price).toLocaleString()}</td>
          <td>₦${Number(m.daily_revenue).toLocaleString()}</td>
          <td>${m.duration_days} Days</td>
          <td><span class="badge ${m.is_active ? 'badge-success' : 'badge-danger'}">${m.is_active ? 'Active' : 'Locked'}</span></td>
          <td style="text-align: right;">
            <button class="btn btn-sm ${m.is_active ? 'btn-reject' : 'btn-approve'}" onclick="toggleMiner('${m.id}', ${m.is_active})">
              ${m.is_active ? '🔒 Lock' : '🔓 Activate'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    window.addMiner = async function() {
      const name = document.getElementById('newMinerName').value;
      const price = document.getElementById('newMinerPrice').value;
      const daily = document.getElementById('newMinerDaily').value;
      const duration = document.getElementById('newMinerDuration').value;
      const limit = document.getElementById('newMinerLimit').value;

      if(!name || !price) return alert('Name and Price are required');

      const { error } = await window.supabase.from('miners').insert({ name, price, daily_revenue: daily, duration_days: duration, purchase_limit: limit, is_active: true });
      if(error) alert('Error: ' + error.message);
      else { alert('✅ Plan added!'); loadMiners(); }
    };

    window.toggleMiner = async function(id, status) {
      await window.supabase.from('miners').update({ is_active: !status }).eq('id', id);
      loadMiners();
    };

    document.addEventListener('DOMContentLoaded', loadMiners);
  </script>
</body>
</html>
