<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html" class="active">👥 Users</a>
      <a href="deposits.html">💰 Deposits</a>
      <a href="withdrawals.html">💸 Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html">⚙️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>User Management</h2>
      <input type="text" id="userSearch" placeholder="🔍 Search users..." class="form-input" style="width: 300px;" onkeyup="filterUsers()" />
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Balance</th>
            <th>Status</th>
            <th>Joined</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" style="text-align:center; padding: 40px;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Update Balance Modal -->
  <div id="balanceModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Update Wallet Balance</h3>
        <button class="close-modal" onclick="closeModal('balanceModal')">&times;</button>
      </div>
      <p style="font-size: 14px; color: var(--admin-text-muted); margin-bottom: 20px;">
        User: <strong id="balModalEmail" style="color: var(--admin-text-main);">-</strong>
      </p>
      <p style="font-size: 13px; color: var(--admin-text-muted); margin-bottom: 20px;">
        Current Balance: <strong id="balModalCurrent" style="color: var(--brand-primary);">₦0</strong>
      </p>
      <input type="hidden" id="balModalUserId" />
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label">Action</label>
        <select id="balAction" class="form-input">
          <option value="credit">➕ Credit (Add Money)</option>
          <option value="debit"> Debit (Remove Money)</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label">Amount (₦)</label>
        <input type="number" id="balAmount" class="form-input" placeholder="0.00" />
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">Reason</label>
        <input type="text" id="balReason" class="form-input" placeholder="e.g. Manual Bonus, Refund" />
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="submitBalanceUpdate()">Confirm Update</button>
    </div>
  </div>

  <!-- Team Modal -->
  <div id="teamModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>User's Referral Team</h3>
        <button class="close-modal" onclick="closeModal('teamModal')">&times;</button>
      </div>
      <div id="teamModalContent" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    let allUsers = [];
    let adminUserId = null;

    // Get admin user ID on load
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabase.auth.getSession();
      if (session) adminUserId = session.user.id;
      await loadUsers();
    });

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">Loading users...</td></tr>';

      // Fetch profiles with wallet balance
      const { data: profiles, error } = await window.supabase
        .from('profiles')
        .select('id, full_name, email, is_active, created_at, wallets(balance)')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--danger);">Error: ${error.message}</td></tr>`;
        return;
      }

      allUsers = profiles || [];
      renderUsers(allUsers);
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--admin-text-muted);">No users found.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const balance = u.wallets?.balance || 0;
        const statusBadge = u.is_active 
          ? '<span class="badge badge-success">Active</span>' 
          : '<span class="badge badge-danger">Banned</span>';
        const isSelf = u.id === adminUserId;
        
        return `
          <tr>
            <td>
              <div style="font-weight:600;">${u.full_name || 'Unnamed'}</div>
              <div style="font-size:13px;color:var(--admin-text-muted);">${u.email || 'No email'}</div>
            </td>
            <td style="font-weight:700; color: var(--brand-primary);">${Number(balance).toLocaleString()}</td>
            <td>${statusBadge}</td>
            <td style="color: var(--admin-text-muted);">${new Date(u.created_at).toLocaleDateString()}</td>
            <td style="text-align: right;">
              <button class="btn btn-sm btn-outline" onclick="openBalanceModal('${u.id}', '${u.email || 'Unknown'}', ${balance})">💰 Balance</button>
              <button class="btn btn-sm btn-outline" onclick="openTeamModal('${u.id}', '${u.full_name || 'User'}')">👥 Team</button>
              ${!isSelf ? `<button class="btn btn-sm ${u.is_active ? 'btn-reject' : 'btn-approve'}" onclick="toggleBan('${u.id}', ${u.is_active})">${u.is_active ? 'Ban' : 'Unban'}</button>` : '<span style="font-size:11px;color:var(--admin-text-muted);">You</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    window.filterUsers = function() {
      const query = document.getElementById('userSearch').value.toLowerCase();
      renderUsers(allUsers.filter(u => 
        (u.email?.toLowerCase().includes(query)) || 
        (u.full_name?.toLowerCase().includes(query))
      ));
    };

    // Balance Modal
    window.openBalanceModal = function(userId, email, currentBalance) {
      document.getElementById('balModalUserId').value = userId;
      document.getElementById('balModalEmail').innerText = email;
      document.getElementById('balModalCurrent').innerText = '₦' + Number(currentBalance).toLocaleString();
      document.getElementById('balAmount').value = '';
      document.getElementById('balReason').value = '';
      document.getElementById('balanceModal').classList.add('active');
    };

    window.submitBalanceUpdate = async function() {
      const userId = document.getElementById('balModalUserId').value;
      const action = document.getElementById('balAction').value;
      const amount = parseFloat(document.getElementById('balAmount').value);
      const reason = document.getElementById('balReason').value || 'Admin adjustment';
      const btn = event.target;

      if (!amount || amount <= 0) return alert('Please enter a valid amount');

      btn.innerText = 'Processing...';
      btn.disabled = true;

      try {
        // 1. Get current wallet balance
        const { data: wallet, error: wErr } = await window.supabase
          .from('wallets')
          .select('balance')
          .eq('user_id', userId)
          .single();

        if (wErr) throw new Error('Could not fetch wallet: ' + wErr.message);

        let newBalance = wallet.balance;
        if (action === 'credit') newBalance += amount;
        else if (action === 'debit') newBalance -= amount;

        if (newBalance < 0) throw new Error('Insufficient funds for this debit');

        // 2. Update wallet balance
        const { error: updateErr } = await window.supabase
          .from('wallets')
          .update({ balance: newBalance })
          .eq('user_id', userId);

        if (updateErr) throw new Error('Failed to update balance: ' + updateErr.message);

        // 3. Create transaction record
        const { error: txErr } = await window.supabase
          .from('transactions')
          .insert({
            user_id: userId,
            type: 'admin_adjustment',
            amount: action === 'credit' ? amount : -amount,
            status: 'completed',
            description: `Admin ${action}: ${reason}`
          });

        if (txErr) throw new Error('Failed to create record: ' + txErr.message);

        alert('✅ Balance updated successfully!');
        closeModal('balanceModal');
        await loadUsers();
      } catch (err) {
        alert(' Error: ' + err.message);
      }

      btn.innerText = 'Confirm Update';
      btn.disabled = false;
    };

    // Team Modal
    window.openTeamModal = async function(userId, userName) {
      document.getElementById('teamModal').classList.add('active');
      const content = document.getElementById('teamModalContent');
      content.innerHTML = '<p style="text-align:center; color: var(--admin-text-muted); padding: 20px;">Loading team for ' + userName + '...</p>';

      const { data: team, error } = await window.supabase
        .from('profiles')
        .select('full_name, email, created_at')
        .eq('referred_by', userId)
        .order('created_at', { ascending: false });

      if (error) {
        content.innerHTML = '<p style="text-align:center; color: var(--danger); padding: 20px;">Error: ' + error.message + '</p>';
        return;
      }

      if (!team || team.length === 0) {
        content.innerHTML = '<p style="text-align:center; color: var(--admin-text-muted); padding: 20px;">No direct referrals found for this user.</p>';
        return;
      }

      content.innerHTML = `
        <p style="font-size: 13px; color: var(--admin-text-muted); margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--admin-border);">
          <strong>${team.length}</strong> direct referral(s)
        </p>
        ${team.map(m => `
          <div style="padding: 12px 0; border-bottom: 1px solid var(--admin-border); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight:600; font-size: 14px;">${m.full_name || 'Unnamed'}</div>
              <div style="font-size:12px;color:var(--admin-text-muted);">${m.email || 'No email'}</div>
            </div>
            <div style="font-size:12px;color:var(--admin-text-muted);">${new Date(m.created_at).toLocaleDateString()}</div>
          </div>
        `).join('')}
      `;
    };

    // Ban/Unban
    window.toggleBan = async function(userId, currentStatus) {
      const action = currentStatus ? 'BAN' : 'UNBAN';
      if (!confirm(`Are you sure you want to ${action} this user?`)) return;

      const { error } = await window.supabase
        .from('profiles')
        .update({ is_active: !currentStatus })
        .eq('id', userId);

      if (error) {
        alert('❌ Error: ' + error.message);
      } else {
        alert(`✅ User ${action}ned successfully!`);
        await loadUsers();
      }
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.remove('active');
    };
  </script>
</body>
</html>
