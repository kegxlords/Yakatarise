<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html" class="active">👥 Users</a>
      <a href="deposits.html"> Deposits</a>
      <a href="withdrawals.html">💸 Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html">⚙️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>User Management</h2>
      <input type="text" id="userSearch" placeholder="🔍 Search users..." class="form-input" style="width: 300px;" onkeyup="filterUsers()" />
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Balance</th>
            <th>Status</th>
            <th>Joined</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" style="text-align:center; padding: 40px;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Update Balance Modal -->
  <div id="balanceModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Update Wallet Balance</h3>
        <button class="close-modal" onclick="closeModal('balanceModal')">&times;</button>
      </div>
      <p style="font-size: 14px; color: var(--admin-text-muted); margin-bottom: 20px;">User: <strong id="balModalEmail" style="color: var(--admin-text-main);">-</strong></p>
      <input type="hidden" id="balModalUserId" />
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label">Action</label>
        <select id="balAction" class="form-input">
          <option value="credit">➕ Credit (Add Money)</option>
          <option value="debit">➖ Debit (Remove Money)</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label">Amount (₦)</label>
        <input type="number" id="balAmount" class="form-input" placeholder="0.00" />
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">Reason</label>
        <input type="text" id="balReason" class="form-input" placeholder="e.g. Manual Bonus" />
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="submitBalanceUpdate()">Confirm Update</button>
    </div>
  </div>

  <!-- Team Modal -->
  <div id="teamModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>User's Referral Team</h3>
        <button class="close-modal" onclick="closeModal('teamModal')">&times;</button>
      </div>
      <div id="teamModalContent" style="max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    let allUsers = [];

    async function loadUsers() {
      const { data: users } = await window.supabase.from('profiles').select('*, wallets(balance)').order('created_at', { ascending: false });
      allUsers = users || [];
      renderUsers(allUsers);
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = users.map(u => {
        const balance = u.wallets?.balance || 0;
        const statusBadge = u.is_active ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-danger">Banned</span>';
        
        return `
          <tr>
            <td>
              <div style="font-weight:600;">${u.full_name || 'Unnamed'}</div>
              <div style="font-size:13px;color:var(--admin-text-muted);">${u.email}</div>
            </td>
            <td style="font-weight:700; color: var(--brand-primary);">${Number(balance).toLocaleString()}</td>
            <td>${statusBadge}</td>
            <td style="color: var(--admin-text-muted);">${new Date(u.created_at).toLocaleDateString()}</td>
            <td style="text-align: right;">
              <button class="btn btn-sm btn-outline" onclick="openBalanceModal('${u.id}', '${u.email}')"> Balance</button>
              <button class="btn btn-sm btn-outline" onclick="openTeamModal('${u.id}')">👥 Team</button>
              <button class="btn btn-sm btn-outline" onclick="impersonateUser('${u.email}')">👁️ View</button>
              <button class="btn btn-sm ${u.is_active ? 'btn-reject' : 'btn-approve'}" onclick="toggleBan('${u.id}', ${u.is_active})">${u.is_active ? 'Ban' : 'Unban'}</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.filterUsers = function() {
      const query = document.getElementById('userSearch').value.toLowerCase();
      renderUsers(allUsers.filter(u => (u.email?.toLowerCase().includes(query)) || (u.full_name?.toLowerCase().includes(query))));
    };

    window.openBalanceModal = function(userId, email) {
      document.getElementById('balModalUserId').value = userId;
      document.getElementById('balModalEmail').innerText = email;
      document.getElementById('balanceModal').classList.add('active');
    };

    window.submitBalanceUpdate = async function() {
      const userId = document.getElementById('balModalUserId').value;
      const action = document.getElementById('balAction').value;
      const amount = parseFloat(document.getElementById('balAmount').value);
      const reason = document.getElementById('balReason').value;
      if(!amount) return alert('Enter a valid amount');

      const result = await callApi('/api/adjust-balance', { user_id: userId, action, amount, reason });
      if(result.success) { alert('✅ Balance updated!'); closeModal('balanceModal'); loadUsers(); }
      else alert('❌ Error: ' + result.error);
    };

    window.openTeamModal = async function(userId) {
      document.getElementById('teamModal').classList.add('active');
      const content = document.getElementById('teamModalContent');
      content.innerHTML = '<p style="text-align:center; color: var(--admin-text-muted);">Loading...</p>';

      const { data: team } = await window.supabase.from('profiles').select('full_name, email, created_at').eq('referred_by', userId);
      if(!team || team.length === 0) {
        content.innerHTML = '<p style="text-align:center; color: var(--admin-text-muted); padding: 20px;">No direct referrals found.</p>';
        return;
      }
      content.innerHTML = team.map(m => `
        <div style="padding: 12px 0; border-bottom: 1px solid var(--admin-border); display: flex; justify-content: space-between;">
          <div><div style="font-weight:500;">${m.full_name || 'Unnamed'}</div><div style="font-size:12px;color:var(--admin-text-muted);">${m.email}</div></div>
          <div style="font-size:12px;color:var(--admin-text-muted);">${new Date(m.created_at).toLocaleDateString()}</div>
        </div>
      `).join('');
    };

    window.impersonateUser = async function(email) {
      if(!confirm(`Generate a magic login link for ${email}?`)) return;
      const result = await callApi('/api/impersonate', { email });
      if(result.magic_link) { window.open(result.magic_link, '_blank'); alert('✅ Magic link opened in new tab.'); }
      else alert(' Error: ' + result.error);
    };

    window.toggleBan = async function(userId, currentStatus) {
      if(!confirm(`${currentStatus ? 'Ban' : 'Unban'} this user?`)) return;
      await window.supabase.from('profiles').update({ is_active: !currentStatus }).eq('id', userId);
      loadUsers();
    };

    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };
    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
  <!-- Admin Mobile Bottom Navigation -->

      </a>
      <a href="deposits.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></svg>

      </a>
      <a href="withdrawals.html" class="admin-nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>

        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Settings
      </a>
    </div>
  </nav>

  <!-- Auto-Highlight Active Link Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentPath = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.admin-nav-item').forEach(link => {
        if (link.getAttribute('href') === currentPath) {
          link.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
