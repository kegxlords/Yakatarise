<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdrawals - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html">👥 Users</a>
      <a href="deposits.html">💰 Deposits</a>
      <a href="withdrawals.html" class="active">💸 Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html">️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Withdrawal Requests</h2>
      <select id="statusFilter" class="form-input" style="width: 200px;" onchange="loadWithdrawals()">
        <option value="pending">Pending Only</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="all">All Transactions</option>
      </select>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Amount</th>
            <th>Fee (8%)</th>
            <th>Net Payout</th>
            <th>Bank Details</th>
            <th>Status</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="withdrawalBody">
          <tr><td colspan="7" style="text-align:center; padding: 40px;">Loading withdrawals...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    async function loadWithdrawals() {
      const filter = document.getElementById('statusFilter').value;
      const tbody = document.getElementById('withdrawalBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">Loading...</td></tr>';

      let query = window.supabase.from('transactions').select('*, profiles(email)').eq('type', 'withdrawal').order('created_at', { ascending: false });
      if (filter !== 'all') query = query.eq('status', filter);

      const { data: txs } = await query;
      if (!txs || txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px; color: var(--admin-text-muted);">No withdrawals found.</td></tr>';
        return;
      }

      tbody.innerHTML = txs.map(tx => {
        const amount = Number(tx.amount);
        const fee = amount * 0.08;
        const net = amount - fee;
        let badgeClass = 'badge-warning';
        if(tx.status === 'approved') badgeClass = 'badge-success';
        if(tx.status === 'rejected') badgeClass = 'badge-danger';

        let actions = tx.status === 'pending' ? `
          <button class="btn btn-sm btn-approve" onclick="approveWithdrawal('${tx.id}')">Mark Paid</button>
          <button class="btn btn-sm btn-reject" onclick="rejectWithdrawal('${tx.id}', '${tx.user_id}', ${amount})">Reject</button>
        ` : '<span style="color: var(--admin-text-muted); font-size: 12px;">Processed</span>';

        return `
          <tr>
            <td><div style="font-weight:500;">${tx.profiles?.email || 'Unknown'}</div></td>
            <td style="font-weight:700;">₦${amount.toLocaleString()}</td>
            <td style="color: var(--danger);">- ₦${fee.toLocaleString()}</td>
            <td style="font-weight:700; color: var(--success);">₦${net.toLocaleString()}</td>
            <td><div style="font-size:12px;color:var(--admin-text-muted);">${tx.description || 'N/A'}</div></td>
            <td><span class="badge ${badgeClass}">${tx.status}</span></td>
            <td style="text-align: right;">${actions}</td>
          </tr>
        `;
      }).join('');
    }

    window.approveWithdrawal = async function(id) {
      if(!confirm('Have you sent the money? Click OK to mark as paid.')) return;
      const result = await callApi('/api/approve-withdrawal', { transaction_id: id });
      if(result.success) { alert('✅ Marked as paid!'); loadWithdrawals(); } else alert('❌ ' + result.error);
    };

    window.rejectWithdrawal = async function(id, userId, amount) {
      if(!confirm(`Reject and refund ₦${amount.toLocaleString()} to user?`)) return;
      // Create /api/reject-withdrawal.js to handle refunding the wallet
      alert('Please create /api/reject-withdrawal.js to handle refunds.');
    };

    document.addEventListener('DOMContentLoaded', loadWithdrawals);
  </script>
</body>
</html>
