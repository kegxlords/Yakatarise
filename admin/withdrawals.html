<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Withdrawals - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo">
      <div style="width:30px;height:30px;background:var(--primary);color:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;">J</div>
      JaKaTaRise Admin
    </div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html">👥 Users</a>
      <a href="deposits.html">💰 Deposits</a>
      <a href="withdrawals.html" class="active"> Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html">️ Global Settings</a>
      <a href="../index.html" style="margin-top: 20px; border-top: 1px solid #1E293B; padding-top: 20px;">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Withdrawal Requests</h2>
    </div>

    <div class="form-card" style="padding: 0; overflow: hidden;">
      <table class="data-table" id="withdrawalTable">
        <thead>
          <tr>
            <th>User</th>
            <th>Amount</th>
            <th>Fee (8%)</th>
            <th>Net Payout</th>
            <th>Bank Details</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="withdrawalBody">
          <tr><td colspan="7" style="text-align:center;">Loading withdrawals...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Fetch Pending Withdrawals
      const { data: txs, error } = await supabase
        .from('transactions')
        .select('*, profiles(full_name, email)')
        .eq('type', 'withdrawal')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('withdrawalBody');

      if (error || !txs || txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 30px;">No pending withdrawal requests.</td></tr>';
        return;
      }

      // 2. Render Table
      tbody.innerHTML = txs.map(tx => {
        const amount = Number(tx.amount);
        const fee = amount * 0.08;
        const net = amount - fee;
        const date = new Date(tx.created_at).toLocaleDateString();
        const email = tx.profiles?.email || 'Unknown User';
        
        // Note: Bank details would ideally be stored in a 'bank_accounts' table or the transaction description. 
        // For now, we assume it's in the description or you can expand the query.
        const bankDetails = tx.description || 'Bank details not provided'; 

        return `
          <tr>
            <td>
              <div style="font-weight:600;">${email}</div>
              <div style="font-size:12px;color:var(--text-muted);">ID: ${tx.id.substring(0,8)}</div>
            </td>
            <td style="font-weight:700;">₦${amount.toLocaleString()}</td>
            <td style="color:var(--danger);">- ₦${fee.toLocaleString()}</td>
            <td style="font-weight:800; color:var(--success);">₦${net.toLocaleString()}</td>
            <td><div style="font-size:12px;color:var(--text-muted);">${bankDetails}</div></td>
            <td>${date}</td>
            <td>
              <button class="btn btn-sm btn-approve" onclick="approveWithdrawal('${tx.id}')">Approve</button>
              <button class="btn btn-sm btn-reject" onclick="rejectWithdrawal('${tx.id}')">Reject</button>
            </td>
          </tr>
        `;
      }).join('');
    });

    // 3. Approve Action
    window.approveWithdrawal = async function(transactionId) {
      if(!confirm("Have you manually sent the money to the user's bank account? Click OK to confirm.")) return;
      
      const result = await callApi('/api/approve-withdrawal', { transaction_id: transactionId });
      
      if (result.success) {
        alert('✅ Withdrawal marked as paid!');
        location.reload();
      } else {
        alert('❌ Error: ' + result.error);
      }
    };

    // 4. Reject Action (Refunds balance)
    window.rejectWithdrawal = async function(transactionId) {
      if(!confirm("Reject this withdrawal? The funds will be refunded to the user's wallet.")) return;
      
      // Note: You would create a /api/reject-withdrawal.js endpoint for this.
      // For now, this is a placeholder.
      alert("Please create the /api/reject-withdrawal.js endpoint to handle refunds.");
    };
  </script>

</body>
</html>
