<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - JaKaTaRise Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar">
    <div class="admin-logo"><div class="admin-logo-icon">J</div>JaKaTaRise</div>
    <nav class="admin-nav">
      <a href="index.html">📊 Overview</a>
      <a href="users.html">👥 Users</a>
      <a href="deposits.html">💰 Deposits</a>
      <a href="withdrawals.html">💸 Withdrawals</a>
      <a href="miners.html">⛏️ Mining Plans</a>
      <a href="settings.html" class="active">⚙️ Settings</a>
      <a href="../index.html" class="view-site">🌐 View Live Site</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Global Settings</h2>
    </div>

    <div id="loadingMsg" style="text-align:center; padding: 40px; color: var(--admin-text-muted);">Loading settings...</div>

    <form id="settingsForm" style="display:none;">
      <div class="form-card">
        <h3>💰 Financial Rules</h3>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Minimum Deposit (₦)</label><input type="number" id="set_min_deposit" class="form-input" /></div>
          <div class="form-group"><label class="form-label">Minimum Withdrawal (₦)</label><input type="number" id="set_min_withdrawal" class="form-input" /></div>
          <div class="form-group"><label class="form-label">Withdrawal Fee (%)</label><input type="number" id="set_withdrawal_fee_percent" class="form-input" step="0.1" /></div>
        </div>
      </div>

      <div class="form-card">
        <h3>⏰ Withdrawal Time Window</h3>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Opening Hour (24h)</label><input type="number" id="set_withdrawal_start_hour" class="form-input" min="0" max="23" /></div>
          <div class="form-group"><label class="form-label">Closing Hour (24h)</label><input type="number" id="set_withdrawal_end_hour" class="form-input" min="0" max="23" /></div>
        </div>
        <label class="form-label" style="margin-top: 20px;">Allowed Days</label>
        <div style="display: flex; gap: 16px; flex-wrap: wrap; background: #F8FAFC; padding: 16px; border-radius: 8px; border: 1px solid var(--admin-border);">
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="1"> Mon</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="2"> Tue</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="3"> Wed</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="4"> Thu</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="5"> Fri</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="6"> Sat</label>
          <label style="display:flex;align-items:center;gap:8px; font-size: 14px;"><input type="checkbox" class="day-check" value="0"> Sun</label>
        </div>
      </div>

      <div class="form-card">
        <h3>🏦 Deposit Bank Details</h3>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Bank Name</label><input type="text" id="set_bank_name" class="form-input" /></div>
          <div class="form-group"><label class="form-label">Account Number</label><input type="text" id="set_account_number" class="form-input" /></div>
          <div class="form-group"><label class="form-label">Account Name</label><input type="text" id="set_account_name" class="form-input" /></div>
        </div>
      </div>

      <div class="form-card">
        <h3>🔗 Support Links</h3>
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Telegram Link</label><input type="url" id="set_telegram_link" class="form-input" /></div>
          <div class="form-group"><label class="form-label">WhatsApp Link</label><input type="url" id="set_customer_service_link" class="form-input" /></div>
        </div>
      </div>

      <button type="button" class="btn btn-primary" style="padding: 12px 24px; font-size: 14px;" onclick="saveAllSettings()">💾 Save All Settings</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/admin-guard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: settings } = await window.supabase.from('settings').select('*');
      if (!settings) return;

      const getVal = (key) => settings.find(s => s.key === key)?.value || '';
      document.getElementById('set_min_deposit').value = getVal('min_deposit');
      document.getElementById('set_min_withdrawal').value = getVal('min_withdrawal');
      document.getElementById('set_withdrawal_fee_percent').value = getVal('withdrawal_fee_percent');
      document.getElementById('set_withdrawal_start_hour').value = getVal('withdrawal_start_hour');
      document.getElementById('set_withdrawal_end_hour').value = getVal('withdrawal_end_hour');
      document.getElementById('set_bank_name').value = getVal('bank_name');
      document.getElementById('set_account_number').value = getVal('account_number');
      document.getElementById('set_account_name').value = getVal('account_name');
      document.getElementById('set_telegram_link').value = getVal('telegram_link');
      document.getElementById('set_customer_service_link').value = getVal('customer_service_link');

      try {
        const days = JSON.parse(getVal('withdrawal_days') || '[]');
        document.querySelectorAll('.day-check').forEach(cb => { if (days.includes(parseInt(cb.value))) cb.checked = true; });
      } catch(e) {}

      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('settingsForm').style.display = 'block';
    });

    window.saveAllSettings = async function() {
      const btn = event.target;
      btn.innerText = 'Saving...'; btn.disabled = true;

      const days = Array.from(document.querySelectorAll('.day-check:checked')).map(cb => parseInt(cb.value));
      const settingsToSave = [
        { key: 'min_deposit', value: document.getElementById('set_min_deposit').value },
        { key: 'min_withdrawal', value: document.getElementById('set_min_withdrawal').value },
        { key: 'withdrawal_fee_percent', value: document.getElementById('set_withdrawal_fee_percent').value },
        { key: 'withdrawal_start_hour', value: document.getElementById('set_withdrawal_start_hour').value },
        { key: 'withdrawal_end_hour', value: document.getElementById('set_withdrawal_end_hour').value },
        { key: 'withdrawal_days', value: JSON.stringify(days) },
        { key: 'bank_name', value: document.getElementById('set_bank_name').value },
        { key: 'account_number', value: document.getElementById('set_account_number').value },
        { key: 'account_name', value: document.getElementById('set_account_name').value },
        { key: 'telegram_link', value: document.getElementById('set_telegram_link').value },
        { key: 'customer_service_link', value: document.getElementById('set_customer_service_link').value }
      ];

      for (const s of settingsToSave) await window.supabase.from('settings').upsert(s, { onConflict: 'key' });

      alert('✅ Settings saved!');
      btn.innerText = '💾 Save All Settings'; btn.disabled = false;
    };
  </script>
</body>
</html>
