<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit Funds - JaKaTaRise Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .page-header-simple { padding: 20px; display: flex; align-items: center; gap: 15px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .back-btn { width: 36px; height: 36px; background: #F8FAFC; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text-main); font-weight: bold; }
    
    .bank-details-card { background: linear-gradient(135deg, #8B0000 0%, #5c0000 100%); margin: 20px; border-radius: 20px; padding: 25px; color: #fff; box-shadow: 0 10px 20px rgba(139, 0, 0, 0.2); }
    .bank-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .bank-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .bank-row .lbl { opacity: 0.8; }
    .bank-row .val { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .copy-icon { background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; }

    .form-container { padding: 0 20px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 12px; color: #64748B; margin-bottom: 8px; font-weight: 600; }
    .input-group input { width: 100%; padding: 15px; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 15px; outline: none; background: #fff; }
    .input-group input:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="page-header-simple">
    <a href="wallet.html" class="back-btn">‹</a>
    <h2 style="margin: 0; font-size: 18px;">Deposit Funds</h2>
  </div>

  <div class="bank-details-card">
    <div class="bank-row"><span class="lbl">Bank Name</span><span class="val">Opay / Moniepoint</span></div>
    <div class="bank-row"><span class="lbl">Account Number</span><span class="val">8012345678 <span class="copy-icon" onclick="copyText('8012345678')">Copy</span></span></div>
    <div class="bank-row"><span class="lbl">Account Name</span><span class="val">JaKaTaRise Capital</span></div>
  </div>

  <div class="form-container">
    <div class="input-group">
      <label>Amount Sent (₦)</label>
      <input type="number" placeholder="e.g. 6200" />
    </div>
    <div class="input-group">
      <label>Transaction Reference / Sender Name</label>
      <input type="text" placeholder="Helps us identify your payment" />
    </div>
    <button class="btn btn-primary btn-block" style="margin-top: 10px; border-radius: 12px; padding: 15px;">I Have Made This Transfer</button>
  </div>

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script>
    function copyText(text) { navigator.clipboard.writeText(text); alert('Copied!'); }
  </script>
</body>
</html>
