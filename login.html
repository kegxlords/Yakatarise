<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - T-Miner</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary); }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo h2 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }
    .auth-logo p { color: var(--text-muted); font-size: 14px; }
    .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .auth-links a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your mining portfolio</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
          <a href="forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL = 'https://oinsfepzlnfpydzdngly.supabase.co'; 
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pbnNmZXB6bG5mcHlkemRuZ2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTg2NDcsImV4cCI6MjEwNjA3NDY0N30.eXyO-ZYcThiwMIy5cAGbOsGECLSqGhLgWVxgnPDxNKQ'; 
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alert');

        btn.disabled = true;
        btn.innerText = 'Signing in...';
        alertBox.style.display = 'none';

        try {
          alert("STEP 1: Starting login request...");
          
          // 1. Attempt Login
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });

          if (error) {
            alert("STEP 2 FAILED: " + error.message);
            btn.disabled = false;
            btn.innerText = 'Sign In';
            return;
          }

          alert("STEP 2 SUCCESS: Logged in! Now checking profile...");

          // 2. Check Profile
          const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('is_active')
            .eq('id', data.user.id)
            .single();

          if (profileError) {
            alert("STEP 3 FAILED: " + profileError.message);
            btn.disabled = false;
            btn.innerText = 'Sign In';
            return;
          }

          alert("STEP 3 SUCCESS: Profile checked. Redirecting now...");

          // 3. Redirect
          window.location.href = 'dashboard.html';

        } catch (err) {
          alert("FATAL ERROR: " + err.message);
          btn.disabled = false;
          btn.innerText = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
