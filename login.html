<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - T-Miner</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary); }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo h2 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }
    .auth-logo p { color: var(--text-muted); font-size: 14px; }
    .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .auth-links a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your mining portfolio</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
          <a href="forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <!-- 1. Load Supabase from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. WE REMOVED api-client.js TO PREVENT IT FROM BREAKING THE PAGE -->

  <script>
    // Wait for the page to fully load
    document.addEventListener('DOMContentLoaded', () => {
      
      // CHECK 1: Did Supabase load?
      if (typeof window.supabase === 'undefined') {
        alert("❌ CRITICAL ERROR: Supabase library failed to load. Check your internet connection.");
        return; // Stop here
      }

      // CHECK 2: Are your credentials filled in?
      const SUPABASE_URL = 'https://oinsfepzlnfpydzdngly.supabase.co'; 
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pbnNmZXB6bG5mcHlkemRuZ2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTg2NDcsImV4cCI6MjEwNjA3NDY0N30.eXyO-ZYcThiwMIy5cAGbOsGECLSqGhLgWVxgnPDxNKQ'; 

      if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
        alert("❌ CRITICAL ERROR: You forgot to put your Supabase URL and Key in the code!");
        return; // Stop here
      }

      // Initialize Supabase
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // CHECK 3: Did the form load?
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alert');

      if (!form || !btn) {
        alert("❌ HTML Error: Could not find the login form or button.");
        return;
      }

      // 3. Attach the click listener
      form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop page reload IMMEDIATELY
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Reset alert
        alertBox.className = 'alert';
        alertBox.style.display = 'none';

        // Update button text
        btn.disabled = true;
        btn.innerText = 'Signing in...';

        try {
          const { data, error } = await supabase.auth.signInWithPassword({ 
            email, 
            password 
          });

          if (error) {
            alertBox.textContent = error.message;
            alertBox.className = 'alert alert-error show';
            btn.disabled = false;
            btn.innerText = 'Sign In';
          } else {
            // Check if banned
            const { data: profile } = await supabase
              .from('profiles')
              .select('is_active')
              .eq('id', data.user.id)
              .single();

            if (profile && profile.is_active === false) {
              await supabase.auth.signOut();
              alertBox.textContent = '⚠️ Your account has been suspended.';
              alertBox.className = 'alert alert-error show';
              btn.disabled = false;
              btn.innerText = 'Sign In';
            } else {
              alertBox.textContent = 'Login successful! Redirecting...';
              alertBox.className = 'alert alert-success show';
              setTimeout(() => window.location.href = 'dashboard.html', 1000);
            }
          }
        } catch (err) {
          alert("❌ UNEXPECTED ERROR: " + err.message);
          btn.disabled = false;
          btn.innerText = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
