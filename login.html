<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - T-Miner</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary); }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo h2 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }
    .auth-logo p { color: var(--text-muted); font-size: 14px; }
    .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .auth-links a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your mining portfolio</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
          <a href="forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/api-client.js"></script>
  <script>
    // ==========================================
    // 1. INITIALIZE SUPABASE CLIENT
    // ==========================================
    // Replace these with your actual Supabase project credentials
    const supabaseUrl = 'YOUR_SUPABASE_URL'; 
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; 
    
    // Initialize and attach to window so other scripts can use it if needed
    window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ==========================================
    // 2. HANDLE LOGIN FORM SUBMISSION
    // ==========================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alert');
      const btn = document.getElementById('loginBtn');

      // Reset alert
      alertBox.className = 'alert';
      alertBox.style.display = 'none';

      // Loading state
      btn.disabled = true;
      btn.innerText = 'Signing in...';

      try {
        // 1. Attempt Login
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          alertBox.textContent = error.message;
          alertBox.className = 'alert alert-error show';
          btn.disabled = false;
          btn.innerText = 'Sign In';
        } else {
          // 2. Check if the user is banned
          const { data: profile, error: profileError } = await window.supabaseClient
            .from('profiles')
            .select('is_active')
            .eq('id', data.user.id)
            .single();

          if (profileError || (profile && profile.is_active === false)) {
            // User is banned or profile fetch failed: Log them out immediately and show message
            await window.supabaseClient.auth.signOut();
            alertBox.textContent = profileError ? '⚠️ Profile error. Please contact support.' : '⚠️ Your account has been suspended. Please contact customer support.';
            alertBox.className = 'alert alert-error show';
            btn.disabled = false;
            btn.innerText = 'Sign In';
          } else {
            // User is active: Proceed to dashboard
            alertBox.textContent = 'Login successful! Redirecting...';
            alertBox.className = 'alert alert-success show';
            setTimeout(() => window.location.href = 'dashboard.html', 1000);
          }
        }
      } catch (err) {
        console.error("Login failed with error:", err); // This will show the exact error in F12 Console
        alertBox.textContent = 'An unexpected error occurred. Please check your internet connection or try again.';
        alertBox.className = 'alert alert-error show';
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
