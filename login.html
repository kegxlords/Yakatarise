<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - JaKaTaRise Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 4px solid var(--primary); }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h2 { color: var(--primary); margin-bottom: 8px; }
    .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .auth-links a { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="text-muted">Sign in to manage your miners</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
        </div>
        
        <div style="text-align: right; margin-bottom: 20px;">
          <a href="forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase (Replace with your actual keys)
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alert');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alertBox.textContent = error.message;
        alertBox.className = 'alert alert-error show';
      } else {
        alertBox.textContent = 'Login successful! Redirecting...';
        alertBox.className = 'alert alert-success show';
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }
    });
  </script>
</body>
</html>
