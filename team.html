<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Team - JaKaTaRise Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .team-header-bg { 
      background: linear-gradient(135deg, #8B0000 0%, #5c0000 100%); 
      padding: 30px 20px 80px; 
      color: #fff; 
      border-bottom-left-radius: 30px; 
      border-bottom-right-radius: 30px; 
    }
    .team-header-bg h1 { color: #fff; margin: 0; font-size: 24px; }
    .team-header-bg p { opacity: 0.9; margin: 5px 0 0; font-size: 14px; }
    
    .referral-card { 
      background: #fff; margin: -50px 20px 20px; border-radius: 20px; 
      padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
      position: relative; z-index: 10; 
    }
    .referral-label { font-size: 12px; color: #94A3B8; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
    .referral-link-box { display: flex; background: #F8FAFC; border-radius: 12px; padding: 5px; border: 1px solid #E2E8F0; }
    .referral-link-box input { flex: 1; background: transparent; border: none; padding: 10px 15px; font-family: monospace; font-size: 14px; color: var(--text-main); outline: none; }
    .referral-link-box button { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    .stats-row { display: flex; gap: 15px; margin-bottom: 20px; padding: 0 20px; }
    .stat-box-modern { flex: 1; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; border: 1px solid #F1F5F9; }
    .stat-box-modern .val { font-size: 20px; font-weight: 800; color: var(--primary); }
    .stat-box-modern .lbl { font-size: 11px; color: #64748B; margin-top: 5px; }

    .commission-card { background: #fff; margin: 0 20px 20px; border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #F1F5F9; }
    .comm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .comm-item { background: #F8FAFC; padding: 10px 5px; border-radius: 10px; text-align: center; border: 1px solid #F1F5F9; }
    .comm-item .pct { font-size: 16px; font-weight: 800; color: var(--accent); }
    .comm-item .lvl { font-size: 10px; color: #64748B; margin-top: 2px; }

    /* Members List Styles */
    .members-section { padding: 0 20px; margin-bottom: 20px; }
    .members-section h3 { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 15px; }
    .member-item { 
      background: #fff; padding: 15px; border-radius: 16px; 
      display: flex; align-items: center; gap: 15px; 
      margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
      border: 1px solid #F1F5F9; 
    }
    .member-avatar { 
      width: 40px; height: 40px; background: var(--primary); color: #fff; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      font-weight: 700; font-size: 16px; flex-shrink: 0; 
    }
    .member-info { flex: 1; }
    .member-name { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .member-date { font-size: 11px; color: #94A3B8; }
    .member-level { 
      background: #FEF3C7; color: #D97706; padding: 4px 10px; 
      border-radius: 12px; font-size: 11px; font-weight: 700; 
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="team-header-bg">
    <h1>My Team</h1>
    <p>Invite friends and earn up to 8% direct bonus.</p>
  </div>

  <div class="referral-card">
    <div class="referral-label">Your Referral Link</div>
    <div class="referral-link-box">
      <input type="text" id="refLink" value="Loading..." readonly />
      <button onclick="copyRef()">Copy</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box-modern">
      <div class="val" id="statDirect">0</div>
      <div class="lbl">Direct Refs</div>
    </div>
    <div class="stat-box-modern">
      <div class="val" id="statTotal">0</div>
      <div class="lbl">Total Team</div>
    </div>
    <div class="stat-box-modern">
      <div class="val" id="statCommissions" style="color: var(--accent);">₦0</div>
      <div class="lbl">Commissions</div>
    </div>
  </div>

  <div class="commission-card">
    <h3 style="margin: 0; font-size: 16px; color: var(--text-main);">Commission Structure</h3>
    <div class="comm-grid">
      <div class="comm-item"><div class="pct">8%</div><div class="lvl">Direct</div></div>
      <div class="comm-item"><div class="pct">5%</div><div class="lvl">Level 1</div></div>
      <div class="comm-item"><div class="pct">2%</div><div class="lvl">Level 2</div></div>
      <div class="comm-item"><div class="pct">1%</div><div class="lvl">Level 3</div></div>
    </div>
  </div>

  <div class="members-section">
    <h3>Recent Direct Referrals</h3>
    <div id="membersList">
      <!-- Populated by JS -->
      <div style="text-align:center; padding: 20px; color: #94A3B8;">Loading team data...</div>
    </div>
  </div>

  <div id="app-footer"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  
  <script>
    function copyRef() {
      const input = document.getElementById('refLink');
      input.select();
      document.execCommand('copy');
      const btn = event.target;
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 2000);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await window.supabase.auth.getSession();
      if(!session) return;
      const userId = session.user.id;

      // 1. Get Referral Code & Link
      const { data: profile } = await window.supabase
        .from('profiles')
        .select('referral_code')
        .eq('id', userId)
        .single();
      
      const refCode = profile?.referral_code || '---';
      const refLink = `${window.location.origin}/register.html?ref=${refCode}`;
      document.getElementById('refLink').value = refLink;

      // 2. Get Team Counts
      const { count: directCount } = await window.supabase
        .from('profiles')
        .select('*', { count: 'exact', head: true })
        .eq('referred_by', userId);

      const { count: l2Count } = await window.supabase
        .from('profiles')
        .select('*', { count: 'exact', head: true })
        .eq('upline_level_2', userId);

      const { count: l3Count } = await window.supabase
        .from('profiles')
        .select('*', { count: 'exact', head: true })
        .eq('upline_level_3', userId);

      const totalTeam = (directCount || 0) + (l2Count || 0) + (l3Count || 0);

      // 3. Get Total Commissions Earned
      const { data: commissions } = await window.supabase
        .from('transactions')
        .select('amount')
        .eq('user_id', userId)
        .eq('type', 'referral_bonus')
        .eq('status', 'completed');

      let totalCommissions = 0;
      if (commissions && commissions.length > 0) {
        totalCommissions = commissions.reduce((sum, tx) => sum + Number(tx.amount), 0);
      }

      // Update UI Stats
      document.getElementById('statDirect').innerText = directCount || 0;
      document.getElementById('statTotal').innerText = totalTeam;
      document.getElementById('statCommissions').innerText = '₦' + totalCommissions.toLocaleString();

      // 4. Get Recent Direct Team Members
      const { data: members } = await window.supabase
        .from('profiles')
        .select('full_name, created_at')
        .eq('referred_by', userId)
        .order('created_at', { ascending: false })
        .limit(5);

      const membersContainer = document.getElementById('membersList');
      if (members && members.length > 0) {
        membersContainer.innerHTML = members.map(m => `
          <div class="member-item">
            <div class="member-avatar">${(m.full_name || 'U')[0].toUpperCase()}</div>
            <div class="member-info">
              <div class="member-name">${m.full_name || 'Unknown User'}</div>
              <div class="member-date">Joined ${new Date(m.created_at).toLocaleDateString()}</div>
            </div>
            <div class="member-level">Level 1</div>
          </div>
        `).join('');
      } else {
        membersContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: #94A3B8; font-size: 14px;">No direct referrals yet. Share your link to start earning!</div>';
      }
    });
  </script>
</body>
</html>
