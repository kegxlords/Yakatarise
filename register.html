<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - JaKaTaRise Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; padding: 40px; border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 5px solid var(--accent); }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo h2 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }
    .auth-logo p { color: var(--text-muted); font-size: 14px; }
    .auth-links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .auth-links a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <h2>Create Account</h2>
        <p>Start your mining journey today</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="+234..." required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required />
        </div>
        <div class="form-group">
          <label class="form-label">Referral Code <span class="text-muted" style="font-weight: 400;">(Optional)</span></label>
          <input type="text" id="refCode" class="form-input" placeholder="Enter referral code" style="text-transform: uppercase;" />
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-links">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/api-client.js"></script>
  <script>
    // 1. Auto-fill Referral Code from URL
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      if (refCode) {
        document.getElementById('refCode').value = refCode.toUpperCase();
      }
    });

    // 2. Handle Form Submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Stop page from reloading
      
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const refCode = document.getElementById('refCode').value.trim().toUpperCase();
      
      const alertBox = document.getElementById('alert');
      const btn = document.getElementById('registerBtn');

      // Reset alert
      alertBox.className = 'alert';
      alertBox.style.display = 'none';

      if (password.length < 6) {
        alertBox.textContent = 'Password must be at least 6 characters.';
        alertBox.className = 'alert alert-error show';
        alertBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Creating account...';

      try {
        console.log("Attempting to sign up:", email); // Debug log
        
        const { data, error } = await window.supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              phone: phone,
              referral_code: refCode || null
            }
          }
        });

        if (error) {
          console.error("Supabase Error:", error); // Debug log
          alertBox.textContent = error.message;
          alertBox.className = 'alert alert-error show';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.innerText = 'Create Account';
        } else {
          console.log("Success:", data); // Debug log
          alertBox.textContent = '✅ Account created! Please check your email to verify your account, then login.';
          alertBox.className = 'alert alert-success show';
          alertBox.style.display = 'block';
          btn.innerText = 'Account Created';
          document.getElementById('registerForm').reset();
        }
      } catch (err) {
        console.error("Unexpected Error:", err); // Debug log
        alertBox.textContent = 'An unexpected error occurred. Check console (F12).';
        alertBox.className = 'alert alert-error show';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Create Account';
      }
    });
  </script>
</body>
</html>
